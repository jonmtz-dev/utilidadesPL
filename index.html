<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Herramientas Moodle</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f2f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Herramientas">
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/shared.css">
    <link rel="stylesheet" href="assets/launcher.css">
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Sin defer: aplica el tema antes del primer pintado -->
    <script src="assets/theme.js"></script>
    <script src="assets/pwa.js"></script>
</head>
<body>
    <div class="background-mesh">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="app-container">
        <header class="app-header glass-panel">
            <div class="logo">
                <i class="ph ph-squares-four"></i>
            </div>
            <div>
                <h1>Panel de Herramientas</h1>
                <p>Tu cajón de utilidades para Moodle</p>
            </div>
        </header>

        <!-- Pantalla de inicio: primero la plataforma, luego sus herramientas.
             Las tarjetas las dibuja launcher.js desde PLATAFORMAS (tools.js). -->
        <section class="portada" id="portada" aria-label="Elige la plataforma">
            <p class="portada-titulo">¿Para qué plataforma vas a maquetar?</p>
            <div class="portada-opciones" id="portada-opciones"></div>
            <button class="portada-todas" id="ver-todas" type="button">
                <i class="ph ph-squares-four"></i> Ver todas las herramientas
            </button>
        </section>

        <div class="launcher-toolbar hidden" id="launcher-toolbar">
            <!-- Con qué plataforma se entró, y la puerta de vuelta a la portada. -->
            <button class="chip-plataforma" id="chip-plataforma" type="button" title="Cambiar de plataforma">
                <i class="ph ph-arrow-left"></i> <span id="chip-texto"></span>
            </button>
            <div class="search-field glass-panel">
                <i class="ph ph-magnifying-glass"></i>
                <input type="search" id="search-input" placeholder="Buscar herramienta…" autocomplete="off" aria-label="Buscar herramienta">
                <kbd>/</kbd>
            </div>
        </div>

        <!-- La rejilla scrollea aquí dentro, pero sin barra: la píldora de abajo
             es la que avisa que hay más (y baja al pulsarla). -->
        <div class="tools-viewport hidden" id="tools-viewport">
            <section class="tools-grid scroll-sin-barra" id="tools-grid"
                     data-pista-scroll data-pista="#pista-abajo"
                     aria-label="Herramientas disponibles"></section>
            <button class="pista-mas hidden" id="pista-abajo" type="button">
                <i class="ph ph-arrow-down"></i> Hay más herramientas
            </button>
        </div>

        <p class="no-results hidden" id="no-results">
            <i class="ph ph-ghost"></i>
            No hay herramientas que coincidan con tu búsqueda.
        </p>
    </main>

    <script src="assets/tools.js"></script>
    <script src="assets/scroll-pista.js"></script>
    <script src="assets/launcher.js"></script>
</body>
</html>
