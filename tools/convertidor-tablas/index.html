<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Tablas a Moodle</title>

    <!-- PWA -->
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#f0f2f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/shared.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Sin defer: aplica el tema antes del primer pintado -->
    <script src="../../assets/theme.js"></script>
    <script src="../../assets/pwa.js"></script>
    <!-- Insignia de version de Moodle: lee el campo `moodle` de tools.js -->
    <script src="../../assets/tools.js"></script>
    <script src="../../assets/version-moodle.js" defer></script>
    <!-- El botón de volver: regresa a la plataforma con la que se entró. -->
    <script src="../../assets/volver.js" defer></script>
</head>
<body>
    <div class="background-mesh">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="app-container glass-panel tablas-app">
        <header class="app-header">
            <div class="logo">
                <i class="ph ph-table"></i>
            </div>
            <div>
                <h1>Convertidor a Tablas Moodle</h1>
                <p>Transforma tablas de Word a formato responsivo (Tarjetas móviles)</p>
            </div>
            <a class="btn-back" href="../../index.html">
                <i class="ph ph-arrow-left"></i> Panel
            </a>
        </header>

        <div class="workspace tablas-workspace" id="workspace">
            <!-- Columna Izquierda: Input y Opciones -->
            <section class="panel-section glass-panel input-section editor-panel">
                <div class="section-header">
                    <h2><i class="ph ph-clipboard-text"></i> 1. Pega tu tabla aquí</h2>
                </div>
                
                <div id="paste-area" class="paste-area" contenteditable="true" data-placeholder="Haz clic aquí y presiona Ctrl+V para pegar tu tabla desde Word o código HTML crudo..."></div>

                <div class="options-group mt-4">
                    <h3><i class="ph ph-sliders"></i> Opciones de Formato</h3>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-bordered" checked>
                        <span class="slider"></span>
                        <span class="label-text">Bordes de tabla (table-bordered)</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-alt-colors" checked>
                        <span class="slider"></span>
                        <span class="label-text">Colorear 1ra columna (Rosa/Verde)</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-header-color" checked>
                        <span class="slider"></span>
                        <span class="label-text">Colorear encabezado (Rosa)</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-repetir-combinadas" checked>
                        <span class="slider"></span>
                        <span class="label-text" title="En celular el rowspan no existe: sin esto, las filas que heredan una celda combinada pierden esas columnas">Repetir celdas combinadas en celular</span>
                    </label>
                    <!-- Apagado por omisión: casi siempre la tabla se pega DENTRO
                         de una página que ya trae su row > col-12, y el código
                         debe empezar en <table class=. Enciéndelo solo si la
                         tabla va suelta y necesita su propio contenedor (el
                         .table-responsive es el que le da scroll horizontal). -->
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-moodle-wrap">
                        <span class="slider"></span>
                        <span class="label-text" title="Agrega row > col-12 > table-responsive alrededor de la tabla. Apagado, el código empieza en &lt;table class=">Envolver en contenedores Moodle</span>
                    </label>
                </div>

                <button id="btn-process" class="btn-primary mt-4" disabled>
                    <i class="ph ph-magic-wand"></i> Cargar Tabla (Paso 1)
                </button>
            </section>

            <div class="divisor" id="divisor" role="separator" aria-orientation="vertical"
                 aria-label="Ancho del panel izquierdo" tabindex="0"
                 title="Arrástralo para repartir el espacio · doble clic para restablecer"></div>

            <!-- Columna Derecha: Vista Previa y Código -->
            <section class="panel-section glass-panel output-section output-panel">

                <div class="tabs">
                    <button class="tab-btn active" data-target="preview"><i class="ph ph-eye"></i> Vista Previa</button>
                    <button class="tab-btn" data-target="code"><i class="ph ph-code"></i> Código Moodle</button>
                </div>

                <div class="tab-content active" id="preview-content">
                    <!-- Solo aparece con la tabla ya generada: en el paso 1 lo que
                         se ve es la tabla clicable, que es interfaz de la
                         herramienta y no una página de Moodle. -->
                    <div class="preview-barra hidden" id="preview-barra">
                        <div class="anchos" role="group" aria-label="Ancho de la vista previa">
                            <button class="ancho-btn active" data-ancho="escritorio" title="Escritorio"><i class="ph ph-desktop"></i> <span>Escritorio</span></button>
                            <button class="ancho-btn" data-ancho="tableta" title="Tableta"><i class="ph ph-device-tablet"></i> <span>Tableta</span></button>
                            <button class="ancho-btn" data-ancho="celular" title="Celular (la tabla se vuelve tarjetas)"><i class="ph ph-device-mobile"></i> <span>Celular</span></button>
                        </div>
                        <!-- El aula solo pinta la previa: el color real lo resuelve
                             la hoja de Moodle con la clase del contenedor de la
                             página. Aquí no cambia ni una letra del código que se
                             copia, y por eso vive en la barra de la previa y no
                             entre las opciones de formato. -->
                        <span class="field-row previa-paleta">
                            <label for="paleta-previa" title="Colores del aula, solo para la vista previa"><i class="ph ph-palette"></i> <span>Aula</span></label>
                            <select id="paleta-previa"></select>
                        </span>
                        <!-- El ancho real en px: es la diferencia entre creer que
                             se está viendo un escritorio y verlo. -->
                        <span class="preview-medida" id="preview-medida"></span>
                        <button class="btn-icono-barra" id="btn-previa-max" type="button" aria-pressed="false" title="Ampliar la vista previa"><i class="ph ph-corners-out"></i></button>
                    </div>
                    <div class="empty-state" id="preview-empty">
                        <i class="ph ph-table"></i>
                        <p>Pega y procesa una tabla para ver la vista previa</p>
                    </div>
                    <!-- Paso 1: avisos y la tabla sobre la que se hace clic. -->
                    <div id="preview-container" class="preview-container hidden">
                        <!-- Tabla previsualizada aquí -->
                    </div>
                    <!-- Paso 2: la tabla ya convertida, dentro de un <iframe> con la
                         hoja real de Moodle. Va en iframe y no en un div porque las
                         media queries miran el ancho de la VENTANA: solo así, al
                         estrechar el marco, se disparan las tarjetas de celular.
                         El sandbox NO lleva allow-scripts: adentro no corre una
                         sola línea de JS, que es lo que importa con HTML pegado
                         de fuera. El allow-same-origin solo sirve para poder
                         asomarse a la previa desde aquí (y comprobar, por
                         ejemplo, que la fuente del aula sí cargó). -->
                    <div id="preview-caja" class="preview-caja hidden"><iframe id="preview-frame" sandbox="allow-same-origin" title="Vista previa de la tabla en Moodle"></iframe></div>
                </div>

                <div class="tab-content" id="code-content">
                    <div class="code-wrapper">
                        <button id="btn-copy" class="btn-icon" title="Copiar código">
                            <i class="ph ph-copy"></i>
                        </button>
                        <textarea id="output-code" class="code-output" readonly placeholder="El código HTML generado aparecerá aquí..."></textarea>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script src="../../assets/tablas.js"></script>
    <script src="../../assets/paletas.js"></script>
    <script src="../../assets/reparto.js"></script>
    <!-- La vista previa se arma con las MISMAS hojas que Guion Instruccional a
         Página: la del tema de Moodle (que solo retoca Bootstrap) y el
         subconjunto de Bootstrap que la acompaña. Se leen de sus carpetas en vez
         de copiarlas aquí; una copia es la que deja vivo un bug durante meses. -->
    <script src="../micrositio-a-pagina/hoja-moodle-default.js"></script>
    <script src="../guion-a-pagina/vista-previa.js"></script>
    <script src="script.js"></script>
</body>
</html>
